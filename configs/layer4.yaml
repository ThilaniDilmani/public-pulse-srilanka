layer: layer4
label_map_path: models/layer4_stance/label_map.json
config_path: models/layer4_stance/config.json
checkpoint_path: models/layer4_stance/checkpoints/best_model

model_input_column: text_clean   # Layer 4 uses cleaned comment text (see src/public_pulse/preprocessing)
max_seq_length: 256

train_split: data/splits/layer4/train.csv
val_split: data/splits/layer4/val.csv
test_split: data/splits/layer4/test.csv

# Training hyperparameters as documented in layer4_02_training_final.ipynb (this
# file documents the existing notebook methodology -- it does NOT define a new
# training pipeline).
learning_rate: 2e-5
train_batch_size: 16
eval_batch_size: 32
num_epochs: 4
weight_decay: 0.01
warmup_ratio: 0.1
seed: 42
class_weighting: weighted_cross_entropy   # weights computed post-oversampling, see class_weights.json (Phase 2)
oversampling:
  applied_to: train_split_only
  floor_per_class: 500
  max_multiplier: 3
model_selection_metric: eval_macro_f1

# 3 final classes: STANCE_CRIT, STANCE_NEUT, STANCE_SUPP.
# STANCE_CRIT_DIR and STANCE_CRIT_SARC were merged into STANCE_CRIT -- do not restore the split.
# NULL is not a model target and has no class index.
