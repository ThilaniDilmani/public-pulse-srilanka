layer: layer1
label_map_path: models/layer1_utility/label_map.json
config_path: models/layer1_utility/config.json
checkpoint_path: models/layer1_utility/checkpoints/best_model

model_input_column: text_raw   # Layer 1 uses raw, uncleaned comment text
max_seq_length: 256            # overrides configs/base.yaml only if different; kept explicit here for clarity

train_split: data/splits/layer1/train.csv
val_split: data/splits/layer1/val.csv
test_split: data/splits/layer1/test.csv

# Training hyperparameters as documented in 02_training.ipynb (this file documents
# the existing notebook methodology -- it does NOT define a new training pipeline).
learning_rate: 2e-5
train_batch_size: 16
eval_batch_size: 32
num_epochs: 4
weight_decay: 0.01
warmup_ratio: 0.1
seed: 42
class_weighting: none   # Layer 1's two classes did not require weighted loss
model_selection_metric: eval_macro_f1
